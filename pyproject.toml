[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "filesonar"
version = "0.1.0"
description = "Local, private search over what your files contain (documents, PDFs, images), exposed to AI agents over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Yacine Boulaioune" }]
keywords = ["search", "semantic-search", "mcp", "ollama", "ocr", "rag", "openclaw", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "python-docx>=1.1",
    "sqlite-vec>=0.1.6",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
filesonar = "filesonar.cli:main"

[project.urls]
Homepage = "https://github.com/yacbln/filesonar"
Issues = "https://github.com/yacbln/filesonar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/filesonar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama server with the configured models"]
addopts = "-m 'not ollama'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"scripts/*" = ["S311"]  # sampling for measurements, not security
